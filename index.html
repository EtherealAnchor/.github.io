<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>Расписание событий</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #FEF8F2;
            font-family: 'Inter', sans-serif;
            color: white;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        body::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; }

        .nav-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            background: #2d0a2a;
            flex-wrap: wrap;
        }

        .nav-button {
            padding: 10px 20px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-weight: 700;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-decoration: none;
            display: inline-block;
            font-size: 0.9rem;
        }

        .nav-button:hover { background: rgba(255, 255, 255, 0.2); }
        .nav-button.active {
            background: #9d1c8c;
            border-color: pink;
        }

        .version-toggle {
            background: #4a148c;
            border-color: #ba68c8;
        }
        .version-toggle.active {
            background: #ff4081;
            border-color: white;
            box-shadow: 0 0 10px rgba(255, 64, 129, 0.5);
        }

        .screenshot-button { background: #27ae60; color: white; border-color: #2ecc71; }
        .screenshot-button:hover { background: #219150; }

        .table-container {
            max-width: 1600px;
            margin: 20px auto;
            overflow-x: auto;
        }

        .capture-wrapper {
            background: linear-gradient(#8347a1, #594AA8);
            display: inline-block;
            min-width: 100%;
            padding-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            background: transparent;
            min-width: 1300px;
        }

        th, td {
            border: 4px solid transparent; 
            background-clip: padding-box !important;
        }

        .week-cell {
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 5px;
            text-align: center;
            color: white;
            border-radius: 12px;
        }

        .week-name { font-weight: 900; font-size: 0.85rem; text-transform: uppercase; display: block; }
        .week-dates { font-size: 0.7rem; font-weight: 800; opacity: 0.7; margin-top: 1px; display: block; }

        .category-cell {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            font-weight: 900;
            font-size: 0.95rem;
            border-radius: 14px;
            width: 180px;
            backdrop-filter: blur(4px);
            text-align: center;
            color: #fff;
            position: sticky;
            left: 0;
            z-index: 20;
        }

        .category-cell-alt {
            background: rgba(152, 102, 153, 0.65);
            padding: 10px;
            font-weight: 900;
            font-size: 0.95rem;
            border-radius: 14px;
            width: 180px;
            backdrop-filter: blur(4px);
            text-align: center;
            color: #fff;
            position: sticky;
            left: 0;
            z-index: 20;
        }

        .content-cell {
            position: relative;
            height: 104px;
        }

        .supply-card {
            background: #F5E9F4;
            height: 96px;
            display: flex;
            align-items: center;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            border-radius: 8px;
            overflow: hidden;
        }

        .supply-assets {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 100%;
            padding: 6px;
            flex-shrink: 0;
        }

        .mini-icons-stack {
            display: flex;
            flex-direction: column;
            gap: 3px;
            justify-content: center;
        }

        .mini-icon { width: 32px; height: 32px; object-fit: contain; background: #73486F; border-radius: 5px; }
        .main-icon { width: 84px; height: 84px; object-fit: cover; border-radius: 6px; }
        .extra-icon { width: 180px; height: 84px; object-fit: cover; border-radius: 6px; }

        .supply-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #2d0a2a;
            flex: 1;
            padding: 0 4px;
            min-width: 0;
            text-align: center;
            height: 100%;
            box-sizing: border-box;
        }

        .text-wrapper {
            width: 100%;
            max-height: 84px;
            overflow: hidden;
            line-height: 1.05;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .text-lg, .text-ex, .text-md, .text-xs {
            display: block;
            width: 100%;
            line-height: 1.05 !important;
            white-space: normal; 
            word-wrap: break-word;
            word-break: normal;
            margin: 0;
            padding: 0;
        }
        
        .duration-1 .text-lg, .duration-1 .text-ex { font-size: 1.1rem; font-weight: 900; }
        .duration-1 .text-md { font-size: 0.9rem; font-weight: 1000; }
        .duration-1 .text-xs { font-size: 0.6rem; }

        .duration-2 .text-md { font-size: 0.85rem; font-weight: 900; }

        }

</head>

                data: {

                        { title: '<span class="text-lg">Экипировка для Элизии</span>', startWeek: 5, duration: 2, icons: {main: "https://act-upload.mihoyo.com/bh3-wiki/2025/01/12/50494840/1737edcad15a83aaace4ecee52ec6075_8178279159088041862.png"} }

                        { title: '<span class="text-lg">Тысячеликий маэстро: Камео!</span>', startWeek: 1, duration: 4, icons: {main: "https://act-upload.mihoyo.com/bh3-wiki/2024/10/12/76321978/07ee9d29bcba4dd500e96852a0a2a986_3880103081974931027.png", rank: "images/Valkyrie_S.png", type: "https://static.wikia.nocookie.net/honkaiimpact3_gamepedia_en/images/e/e5/Fire_DMG_%28Icon%29.png"} },

                        ],
                    "Наряд": [
                        { title: '<span class="text-ex">Воспомина-</br>ния времени</span><span class="text-md">9600 кристаллов</span>', startWeek: 5, duration: 2, icons: { extra: "images/timely.png" } },
                    ],
                }

        let currentVersion = 1;
        const imageCache = new Map();
        const PROXIES = ["https://corsproxy.io/?", "https://api.allorigins.win/raw?url=", "https://api.codetabs.com/v1/proxy?quest="];

        async function fetchImageAsBase64(url) {
            if (!url || url.startsWith('data:') || url.startsWith('images/')) return url;
            if (imageCache.has(url)) return imageCache.get(url);
            for (const proxy of PROXIES) {
                try {
                    const response = await fetch(proxy + encodeURIComponent(url));
                    if (!response.ok) continue;
                    const blob = await response.blob();
                    const b64 = await new Promise(r => { const f = new FileReader(); f.onloadend = () => r(f.result); f.readAsDataURL(blob); });
                    imageCache.set(url, b64);
                    return b64;
                } catch(e) {}
            }
            return url;
        }

        async function preloadAllResources() {
            const urls = new Set();
            Object.values(configs).forEach(conf => {
                Object.values(conf.data).flat().forEach(v => {
                    if(v.icons.main) urls.add(v.icons.main);
                    if(v.icons.rank) urls.add(v.icons.rank);
                    if(v.icons.type) urls.add(v.icons.type);
                    if(v.icons.extra) urls.add(v.icons.extra);
                });
            });
            await Promise.all([...Array.from(urls).map(u => fetchImageAsBase64(u)), document.fonts.ready]);
            document.getElementById('loading-overlay').style.opacity = '0';
            setTimeout(() => document.getElementById('loading-overlay').style.display = 'none', 500);
        }

        function switchVersion(v) {
            currentVersion = v;
            document.getElementById('btn-v1').classList.toggle('active', v === 1);
            document.getElementById('btn-v2').classList.toggle('active', v === 2);
            buildTableStructure();
            renderBanners();
        }

        function buildTableStructure() {
            const config = configs[currentVersion];
            const h = document.getElementById('weeksHeader');
            const b = document.getElementById('tableBody');

            h.innerHTML = '<th style="width: 180px; background: transparent !important; border: 3px solid transparent;"></th>';
            b.innerHTML = '';

            for(let i=1; i<=config.totalWeeks; i++){
                const th = document.createElement('th'); th.className = 'week-cell';
                th.innerHTML = `<span class="week-name">НЕДЕЛЯ ${i}</span><span class="week-dates">${config.weekDates[i-1] || ''}</span>`;
                h.appendChild(th);
            }

            categories.forEach((cat, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td class="${idx%2===0?'category-cell':'category-cell-alt'}">${cat}</td>` + 
                    Array.from({length:config.totalWeeks},(_,i)=>`<td class="content-cell" id="cell-${cat}-${i+1}"></td>`).join('');
                b.appendChild(tr);
            });
        }

        function renderBanners() {
            const config = configs[currentVersion];
            const data = config.data;

            document.querySelectorAll('.supply-card').forEach(el => el.remove());

            for(const cat of categories){
                if(!data[cat]) continue;
                for(const item of data[cat]){
                    const start = document.getElementById(`cell-${cat}-${item.startWeek}`);
                    const endWeekNum = Math.min(item.startWeek + item.duration - 1, config.totalWeeks);
                    const end = document.getElementById(`cell-${cat}-${endWeekNum}`);
                    
                    if(start && end){
                        const card = document.createElement('div');
                        let durClass = 'duration-1';
                        if(item.duration===2) durClass='duration-2';
                        else if(item.duration===3) durClass='duration-3';
                        else if(item.duration>=4) durClass='duration-4-plus';
                        
                        card.className = `supply-card ${durClass}`;
                        const pad = 4;
                        card.style.width = `${(end.offsetLeft + end.offsetWidth) - start.offsetLeft - (pad*2)}px`;
                        card.style.left = `${pad}px`;

                        let assets = '';
                        if(item.icons.extra){
                            const iconUrl = imageCache.get(item.icons.extra) || item.icons.extra;
                            assets = `<img src="${iconUrl}" class="extra-icon">`;
                        } else {
                            const rankUrl = imageCache.get(item.icons.rank) || item.icons.rank;
                            const typeUrl = imageCache.get(item.icons.type) || item.icons.type;
                            const mainUrl = imageCache.get(item.icons.main) || item.icons.main;

                            const stack = `<div class="mini-icons-stack">
                                ${item.icons.rank?`<img src="${rankUrl}" class="mini-icon">`:''}
                                ${item.icons.type?`<img src="${typeUrl}" class="mini-icon">`:''}
                            </div>`;
                            assets = `${stack}<img src="${mainUrl}" class="main-icon">`;
                        }
                        card.innerHTML = `
                            <div class="supply-assets">${assets}</div>
                            <div class="supply-content">
                                <div class="text-wrapper">${item.title}</div>
                            </div>`;
                        start.appendChild(card);
                    }
                }
            }
        }

        async function takeScreenshot() {
            const node = document.getElementById('capture-area');
            const btn = document.getElementById('screenshotBtn');
            btn.innerText = "⌛ Обработка..."; btn.disabled = true;
            try {
                await document.fonts.ready;
                await new Promise(r => setTimeout(r, 200));
                
                const dataUrl = await window.htmlToImage.toPng(node, { 
                    pixelRatio: 3,
                    backgroundColor: '#FEF8F2',
                    fontEmbedCSS: true
                });
                const link = document.createElement('a');
                link.download = `Schedule_v${currentVersion}.png`; 
                link.href = dataUrl; 
                link.click();
            } catch (e) { console.error(e); } finally { btn.innerText = "Создать скриншот"; btn.disabled = false; }
        }

        window.onload = async () => {
            buildTableStructure();
            await preloadAllResources();
            renderBanners();
        };

        window.onresize = renderBanners;
    </script>
</body>
</html>
